[program:realtime-voice-api]
directory=/path/to/RealTimeVoiceApi
command=/path/to/venv/bin/uvicorn realtime_voice.main:app --host 0.0.0.0 --port 8003
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=130
stdout_logfile=/var/log/realtime-voice-api.log
stderr_logfile=/var/log/realtime-voice-api.err.log
